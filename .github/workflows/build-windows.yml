name: Build Windows

# This workflow is for testing and manual builds.
# For official releases, use the release.yml workflow by pushing a git tag.
# Trigger this manually from the Actions tab when you need to test builds.
#
# Windows builds are currently unsigned (no Authenticode certificate). Users
# will see a SmartScreen warning on first run.
#
# x64 only. There is no arm64 leg because uv.lock has no win_arm64 wheels for
# numpy, pandas, cryptography, blis or sqlalchemy, so `uv sync` would fall back
# to sdists needing an MSVC ARM64 toolchain and BLAS. Windows 11 on ARM runs the
# x64 build under emulation, which is what the bundled x64 DCMTK already relies
# on (see scripts/build-windows.ps1).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Not "recursive": dicom-deid-rs's own reference submodules are large
          # and unnecessary for a build (matches test-suite.yml).
          submodules: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.10.3'

      - name: Set up Python
        run: uv python install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust
        run: rustup toolchain install stable

      - name: Build NSIS installer
        run: pwsh scripts/build-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: icore-x64-setup
          # Narrow glob: electron-builder also drops elevate.exe and uninstaller
          # stubs into dist/.
          path: electron/dist/*Setup*.exe
          if-no-files-found: error
