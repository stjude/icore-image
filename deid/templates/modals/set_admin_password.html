<!-- Blocking first-run modal: shown on every page until an admin password is set. -->
<div id="setAdminPasswordModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center" style="z-index: 1000;">
    <div class="bg-white p-6 rounded-lg shadow-lg w-[480px]">
        <h2 class="text-lg font-medium text-gray-900 mb-2">Set Administrator Password</h2>
        <p class="text-sm text-gray-600 mb-4">
            Choose a password for the Administrator settings. It must be at least 20 characters
            and include an uppercase letter, a lowercase letter, a number, and a symbol.
            Store it in your institution's password manager.
        </p>
        <input type="password" id="new-admin-password" class="border-2 border-gray-300 p-2 mb-3 w-full"
               placeholder="New password" autocomplete="new-password">
        <input type="password" id="confirm-admin-password" class="border-2 border-gray-300 p-2 mb-4 w-full"
               placeholder="Confirm password" autocomplete="new-password">
        <div id="set-admin-password-error" class="text-sm text-red-600 mb-4 hidden"></div>
        <div class="flex justify-end">
            <button id="setAdminPasswordBtn" onclick="setAdminPassword()"
                    class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                Set Password
            </button>
        </div>
    </div>
</div>
<script>
    async function setAdminPassword() {
        const password = document.getElementById('new-admin-password').value;
        const confirmation = document.getElementById('confirm-admin-password').value;
        const errorDiv = document.getElementById('set-admin-password-error');
        const showError = (message) => {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
        };

        if (password !== confirmation) {
            showError('Passwords do not match.');
            return;
        }

        try {
            const response = await fetch('/set_admin_password/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                body: JSON.stringify({ password: password })
            });
            const result = await response.json();
            if (result.status === 'success') {
                document.getElementById('setAdminPasswordModal').remove();
            } else {
                showError(result.message || 'Could not set the password.');
            }
        } catch (error) {
            console.error('Error setting admin password:', error);
            showError('Could not set the password.');
        }
    }

    document.getElementById('confirm-admin-password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') setAdminPassword();
    });
</script>
